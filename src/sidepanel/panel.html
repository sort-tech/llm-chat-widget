<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>페이지 챗봇</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="../../icons/icon32.png" alt="" width="20" height="20" />
        <span>페이지 챗봇</span>
      </div>
      <div class="topbar-actions">
        <label class="sr-only" for="model-select">모델</label>
        <select id="model-select" class="model-select" title="모델 선택"></select>
        <button id="btn-new" class="icon-btn" type="button" title="새 대화 시작">
          <span aria-hidden="true">＋</span><span class="sr-only">새 대화</span>
        </button>
        <button id="btn-settings" class="icon-btn" type="button" title="설정 열기">
          <span aria-hidden="true">⚙</span><span class="sr-only">설정</span>
        </button>
        <button id="btn-close" class="icon-btn" type="button" title="패널 닫기" hidden>
          <span aria-hidden="true">✕</span><span class="sr-only">닫기</span>
        </button>
      </div>
    </header>

    <section class="contextbar" id="contextbar">
      <span class="ctx-dot" id="ctx-dot" aria-hidden="true"></span>
      <div class="ctx-text">
        <strong id="ctx-title">페이지를 읽는 중…</strong>
        <small id="ctx-meta"></small>
      </div>
      <div class="ctx-actions">
        <label class="sr-only" for="ctx-mode">페이지 참조 범위</label>
        <select id="ctx-mode" title="페이지 참조 범위">
          <option value="page">전체 페이지</option>
          <option value="selection">선택 영역</option>
          <option value="off">사용 안 함</option>
        </select>
        <button id="btn-refresh" class="icon-btn" type="button" title="페이지 다시 읽기">
          <span aria-hidden="true">⟳</span><span class="sr-only">페이지 다시 읽기</span>
        </button>
      </div>
    </section>

    <div id="banner" class="banner" role="alert" hidden>
      <div class="banner-text">
        <strong id="banner-title"></strong>
        <span id="banner-hint"></span>
      </div>
      <div class="banner-actions">
        <button id="banner-action" class="link-btn" type="button" hidden></button>
        <button id="banner-close" class="icon-btn" type="button" title="알림 닫기">
          <span aria-hidden="true">✕</span><span class="sr-only">알림 닫기</span>
        </button>
      </div>
    </div>

    <main id="messages" class="messages" role="log" tabindex="0"></main>

    <p id="status" class="status" aria-live="polite"></p>

    <div id="quick" class="quick"></div>

    <footer class="composer">
      <label class="sr-only" for="input">질문 입력</label>
      <textarea
        id="input"
        class="input"
        rows="1"
        placeholder="이 페이지에 대해 물어보세요 · Enter 전송 / Shift+Enter 줄바꿈"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
      <div class="composer-row">
        <small id="composer-meta" class="composer-meta"></small>
        <button id="btn-stop" class="btn btn-ghost" type="button" hidden>중지</button>
        <button id="btn-send" class="btn btn-primary" type="button">전송</button>
      </div>
    </footer>

    <script type="module" src="panel.js"></script>
  </body>
</html>
