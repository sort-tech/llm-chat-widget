<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>페이지 챗봇</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <!--
      상단은 한 줄입니다. 브라우저 사이드 패널이 이미 확장 프로그램 이름과 아이콘을
      헤더에 보여 주므로 내부에서 반복하지 않고, 그 자리를 대화 영역에 돌려줍니다.
      왼쪽: 상태 점 + 현재 페이지 제목 / 오른쪽: 참조 범위 + 도구 버튼
    -->
    <header class="topbar" id="topbar">
      <span class="ctx-dot" id="ctx-dot" aria-hidden="true"></span>
      <strong id="ctx-title" class="ctx-title">페이지를 읽는 중…</strong>

      <div class="topbar-actions">
        <label class="sr-only" for="ctx-mode">페이지 참조 범위</label>
        <select id="ctx-mode" class="mini-select" title="페이지 참조 범위">
          <option value="page">전체 페이지</option>
          <option value="selection">선택 영역</option>
          <option value="off">참조 안 함</option>
        </select>
        <button id="btn-refresh" class="icon-btn" type="button" title="페이지 다시 읽기">
          <span aria-hidden="true">⟳</span><span class="sr-only">페이지 다시 읽기</span>
        </button>
        <button id="btn-new" class="icon-btn" type="button" title="새 대화 시작">
          <span aria-hidden="true">＋</span><span class="sr-only">새 대화</span>
        </button>
        <button id="btn-settings" class="icon-btn" type="button" title="설정 열기">
          <span aria-hidden="true">⚙</span><span class="sr-only">설정</span>
        </button>
        <button id="btn-close" class="icon-btn" type="button" title="패널 닫기" hidden>
          <span aria-hidden="true">✕</span><span class="sr-only">닫기</span>
        </button>
      </div>
    </header>

    <div id="banner" class="banner" role="alert" hidden>
      <div class="banner-text">
        <strong id="banner-title"></strong>
        <span id="banner-hint"></span>
      </div>
      <div class="banner-actions">
        <button id="banner-action" class="link-btn" type="button" hidden></button>
        <button id="banner-close" class="icon-btn" type="button" title="알림 닫기">
          <span aria-hidden="true">✕</span><span class="sr-only">알림 닫기</span>
        </button>
      </div>
    </div>

    <main id="messages" class="messages" role="log" tabindex="0"></main>

    <footer class="composer">
      <p id="status" class="status" aria-live="polite"></p>

      <!-- 대화가 시작되면 접어 두고, 필요할 때 펴서 씁니다(대화 본문 가시성 우선). -->
      <div class="quick-wrap">
        <button id="quick-toggle" class="quick-toggle" type="button" aria-expanded="false" hidden>
          빠른 질문 <span aria-hidden="true">▾</span>
        </button>
        <div id="quick" class="quick"></div>
      </div>

      <div class="input-wrap">
        <label class="sr-only" for="input">질문 입력</label>
        <textarea
          id="input"
          class="input"
          rows="1"
          placeholder="현재 페이지에 대해 질문하세요…"
          title="Enter 전송 · Shift+Enter 줄바꿈"
          autocomplete="off"
          spellcheck="false"
        ></textarea>
        <button id="btn-send" class="send-btn" type="button" title="전송 (Enter)">
          <span aria-hidden="true">↑</span><span class="sr-only">전송</span>
        </button>
        <button id="btn-stop" class="send-btn is-stop" type="button" title="중지 (Esc)" hidden>
          <span aria-hidden="true">■</span><span class="sr-only">중지</span>
        </button>
      </div>

      <div class="composer-meta">
        <span id="ref-badge" class="ref-badge"></span>
        <span class="input-hint">Enter 전송 · Shift+Enter 줄바꿈</span>
        <label class="sr-only" for="model-select">모델</label>
        <select id="model-select" class="mini-select model-select" title="모델 선택"></select>
      </div>
    </footer>

    <script type="module" src="panel.js"></script>
  </body>
</html>
