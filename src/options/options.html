<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="o.docTitle">페이지 챗봇 설정</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <!-- 문구는 data-i18n 속성의 키로 번역됩니다(src/lib/locales). 여기 적힌 한국어는 스크립트 전 기본값입니다. -->
    <header class="head">
      <img src="../../icons/icon48.png" alt="" width="36" height="36" />
      <div>
        <h1 data-i18n="o.title">페이지 챗봇 설정</h1>
        <p data-i18n="o.lead">LiteLLM(OpenAI 호환) 서버 정보와 답변 방식을 정합니다.</p>
      </div>
    </header>

    <main>
      <section class="card">
        <h2 data-i18n="o.connection">연결</h2>

        <div class="field">
          <label for="baseUrl" data-i18n="o.baseUrl">서버 주소</label>
          <input
            id="baseUrl"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="http://localhost:4000"
          />
          <small data-i18n-html="o.baseUrlHelp"></small>
        </div>

        <div class="field">
          <label for="apiKey" data-i18n="o.apiKey">API 키</label>
          <div class="row">
            <input
              id="apiKey"
              type="password"
              spellcheck="false"
              autocomplete="off"
              placeholder="sk-..."
            />
            <button id="toggleKey" class="btn btn-ghost" type="button" data-i18n="opt.show">표시</button>
          </div>
          <small data-i18n="o.apiKeyHelp"></small>
        </div>

        <div class="field">
          <label for="model" data-i18n="o.model">모델</label>
          <div class="row">
            <input id="model" type="text" list="modelList" spellcheck="false" autocomplete="off" />
            <datalist id="modelList"></datalist>
            <button id="loadModels" class="btn btn-ghost" type="button" data-i18n="o.loadModels">
              목록 불러오기
            </button>
          </div>
          <small data-i18n-html="o.modelHelp"></small>
        </div>

        <div class="field">
          <button id="testConnection" class="btn btn-primary" type="button" data-i18n="o.test">
            연결 테스트
          </button>
          <div id="testResult" class="result" hidden></div>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="o.answers">답변</h2>

        <div class="field">
          <label for="systemPrompt" data-i18n="o.systemPrompt">시스템 프롬프트</label>
          <textarea id="systemPrompt" rows="8" spellcheck="false"></textarea>
          <small data-i18n="o.systemPromptHelp"></small>
        </div>

        <div class="grid">
          <div class="field">
            <label for="temperature">temperature</label>
            <input id="temperature" type="number" min="0" max="2" step="0.1" />
          </div>
          <div class="field">
            <label for="maxTokens">max_tokens</label>
            <input id="maxTokens" type="number" min="0" max="200000" step="128" />
            <small data-i18n="o.maxTokensHelp">0 = 서버 기본값</small>
          </div>
          <div class="field">
            <label for="timeoutSec" data-i18n="o.timeout">응답 제한 시간(초)</label>
            <input id="timeoutSec" type="number" min="5" max="600" step="5" />
            <small data-i18n="o.timeoutHelp"></small>
          </div>
          <div class="field">
            <label for="historyTurns" data-i18n="o.history">기억할 이전 메시지 수</label>
            <input id="historyTurns" type="number" min="0" max="100" step="2" />
          </div>
        </div>

        <label class="check">
          <input id="stream" type="checkbox" />
          <span data-i18n="o.stream">스트리밍으로 받기 (답변이 한 글자씩 나타남)</span>
        </label>
      </section>

      <section class="card">
        <h2 data-i18n="o.pageRef">페이지 참조</h2>

        <div class="grid">
          <div class="field">
            <label for="contextMode" data-i18n="o.contextMode">기본 참조 범위</label>
            <select id="contextMode">
              <option value="page" data-i18n="scope.page">전체 페이지</option>
              <option value="selection" data-i18n="scope.selection">선택 영역</option>
              <option value="off" data-i18n="scope.off">참조 안 함</option>
            </select>
          </div>
          <div class="field">
            <label for="maxContextChars" data-i18n="o.maxChars">본문 최대 전송 글자 수</label>
            <input id="maxContextChars" type="number" min="500" max="200000" step="1000" />
            <small data-i18n="o.maxCharsHelp"></small>
          </div>
        </div>

        <label class="check">
          <input id="sendPageUrl" type="checkbox" />
          <span data-i18n="o.sendUrl">페이지 제목·URL 도 함께 보내기</span>
        </label>
      </section>

      <section class="card">
        <h2 data-i18n="o.agent">에이전트 모드</h2>
        <p class="card-lead" data-i18n-html="o.agentLead"></p>
        <div class="grid">
          <div class="field">
            <label for="agentConfirm" data-i18n="o.agentConfirm">실행 전 승인</label>
            <select id="agentConfirm">
              <option value="risky" data-i18n="o.agentRisky">위험한 동작만 묻기 (결제·삭제·제출 등)</option>
              <option value="always" data-i18n="o.agentAlways">화면을 바꾸는 모든 동작마다 묻기</option>
            </select>
            <small data-i18n="o.agentConfirmHelp"></small>
          </div>
          <div class="field">
            <label for="agentMaxSteps" data-i18n="o.agentMaxSteps">지시 한 번에 허용할 최대 동작 수</label>
            <input id="agentMaxSteps" type="number" min="3" max="60" step="1" />
            <small data-i18n="o.agentMaxStepsHelp"></small>
          </div>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="o.display">화면</h2>
        <div class="grid">
          <div class="field">
            <label for="language" data-i18n="o.language">언어</label>
            <select id="language">
              <option value="auto" data-i18n="o.languageAuto">브라우저 언어 따름</option>
              <option value="ko">한국어</option>
              <option value="en">English</option>
            </select>
            <small data-i18n="o.languageHelp"></small>
          </div>
          <div class="field">
            <label for="theme" data-i18n="o.theme">테마</label>
            <select id="theme">
              <option value="system" data-i18n="o.themeSystem">시스템 설정 따름</option>
              <option value="light" data-i18n="o.themeLight">라이트</option>
              <option value="dark" data-i18n="o.themeDark">다크</option>
            </select>
            <small data-i18n="o.themeHelp"></small>
          </div>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="o.panelPos">패널 위치</h2>
        <label class="check">
          <input type="radio" name="panelMode" value="sidepanel" />
          <span data-i18n-html="o.sidepanel"></span>
        </label>
        <label class="check">
          <input type="radio" name="panelMode" value="inpage" />
          <span data-i18n-html="o.inpage"></span>
        </label>
      </section>

      <section class="card muted">
        <h2 data-i18n="o.notes">참고</h2>
        <ul>
          <li>
            <span data-i18n="o.shortcutBefore">단축키는</span>
            <code id="shortcutUrl">chrome://extensions/shortcuts</code>
            <span data-i18n-html="o.shortcutAfter"></span>
            <button id="copyShortcut" class="btn btn-ghost btn-sm" type="button" data-i18n="opt.copyUrl">
              주소 복사
            </button>
          </li>
          <li data-i18n="o.noteConversations"></li>
          <li data-i18n="o.notePage"></li>
        </ul>
      </section>
    </main>

    <footer class="actions">
      <span id="saveState" class="save-state"></span>
      <button id="reset" class="btn btn-ghost" type="button" data-i18n="o.reset">기본값으로 되돌리기</button>
      <button id="save" class="btn btn-primary" type="button" data-i18n="o.save">저장</button>
    </footer>

    <script type="module" src="options.js"></script>
  </body>
</html>
