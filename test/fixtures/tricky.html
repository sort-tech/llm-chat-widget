<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>까다로운 페이지</title></head>
<body>
  <!-- 본문 컨테이너 클래스에 'nav' 가 들어 있고, 모달 때문에 aria-hidden 이 걸린 경우 -->
  <div class="app-navigation-wrapper" aria-hidden="true">
    <article>
      <header><h1>기사 제목은 header 안에 있다</h1><p class="byline">작성자 홍길동</p></header>
      <p>본문 첫 단락입니다. 잡음 제거 규칙이 지나치게 동작하면 이 글이 전부 사라집니다. 길이를 확보하기 위해 문장을 더 붙입니다.</p>
      <p>단어 경계 확인: 안녕<b>하세요</b> 그리고 숫자 1<span>234</span>5 입니다.</p>
      <table>
        <tr><td>값<br>3</td><td><div>가</div><div>나</div></td><td>4</td></tr>
      </table>
      <p>마지막 단락입니다. 충분한 분량을 위해 문장을 조금 더 이어 붙여 둡니다. 이 문장도 본문에 포함되어야 합니다.</p>
      <footer><p>각주: 이 기사는 테스트용입니다.</p></footer>
    </article>
  </div>
  <div class="ad">광고</div>
</body>
</html>
