<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><title>입력창 주입 시험</title>
  <style>
    body { font: 14px/1.6 system-ui, sans-serif; margin: 0; padding: 16px 20px; }
    fieldset { margin: 0 0 14px; border: 1px solid #ddd; border-radius: 8px; }
    legend { font-weight: 700; font-size: 12px; color: #555; }
    textarea, input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
    .rich { min-height: 60px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 6px; }
    .hidden { display: none; }
    iframe { width: 100%; height: 120px; border: 1px solid #ccc; border-radius: 6px; }
    #log { white-space: pre; font: 11px/1.5 ui-monospace, monospace; color: #334; }
  </style>
</head>
<body>
  <h1>입력창 주입 시험 페이지</h1>

  <fieldset><legend>1. 일반 textarea (빈 칸)</legend>
    <textarea id="plain" rows="2"></textarea>
  </fieldset>

  <fieldset><legend>2. 이미 작성 중인 textarea (커서 중간)</legend>
    <textarea id="mid" rows="2">앞부분|뒷부분</textarea>
  </fieldset>

  <fieldset><legend>3. React 식 controlled input (인스턴스 세터 감시)</legend>
    <input id="react" type="text" />
  </fieldset>

  <fieldset><legend>4. contenteditable 리치 에디터</legend>
    <div id="rich" class="rich" contenteditable="true">기존 내용</div>
  </fieldset>

  <fieldset><legend>5. 제외돼야 하는 것들</legend>
    <input id="ro" type="text" value="읽기 전용" readonly />
    <input id="dis" type="text" value="비활성" disabled />
    <input id="pw" type="password" value="secret" />
    <input id="cb" type="checkbox" />
    <input id="hid" class="hidden" type="text" />
  </fieldset>

  <fieldset><legend>6. iframe 안의 입력창</legend>
    <iframe id="frame" src="/test/fixtures/inputs-frame.html"></iframe>
  </fieldset>

  <fieldset><legend>7. 캔버스(입력창 없음)</legend>
    <canvas width="200" height="40"></canvas>
  </fieldset>

  <div id="log"></div>

  <script>
    // React 의 value 트래커를 흉내 냅니다.
    // 인스턴스 세터로 값을 바꾸면 트래커가 같이 갱신되어 프레임워크가 변경을 놓칩니다.
    // 따라서 주입 코드는 '프로토타입의 네이티브 세터' 를 써야 하고,
    // 그 경우 아래 instanceSetterUsed 는 false 로 남아야 합니다.
    const react = document.getElementById('react');
    window.__probe = { instanceSetterUsed: false, inputEvents: [], changeEvents: 0 };
    const protoDesc = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
    Object.defineProperty(react, 'value', {
      configurable: true,
      get() { return protoDesc.get.call(this); },
      set(v) { window.__probe.instanceSetterUsed = true; protoDesc.set.call(this, v); },
    });
    react.addEventListener('input', (e) => window.__probe.inputEvents.push(e.target.value));
    react.addEventListener('change', () => { window.__probe.changeEvents += 1; });

    // 2번 textarea: '|' 위치에 커서를 둡니다.
    const mid = document.getElementById('mid');
    const caret = mid.value.indexOf('|');
    mid.value = mid.value.replace('|', '');
    window.__caret = caret;

    // 링크 이동/폼 전송이 선택 클릭으로 발생하지 않는지 확인하기 위한 표식
    window.__navigated = false;
    document.addEventListener('click', (e) => { if (e.target.tagName === 'A') window.__navigated = true; });
  </script>
</body>
</html>
